name: Pleiades join

# The PR workflow validates without the Pleiades index (no dump download on
# every PR). This one fetches the daily dump and runs the full join check, so
# a place deleted or renumbered upstream surfaces within a week, not at the
# next release.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pleiades
      - run: pnpm validate
